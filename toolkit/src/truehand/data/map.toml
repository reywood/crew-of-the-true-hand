# The locations sea-chart (locations.html).
#
# order is significant: it is the order pins and cartouche entries render in.

cartouche_order = ["Far South", "Beyond the Charts", "Whereabouts Unknown"]
map_image_src = "static/faerun.png"
map_image_alt = "A map of the Sword Coast"

# On-chart pins: x%, y% of the map image (faerun.png, 1573x1000).
# Coords are the brass dot position; "dir" nudges the label off the dot.
# Region labels (no dot) are centred on the coord. Most positions come
# from faerun.csv (pixel coords divided by map size).
# Entries with a "cartouche" key instead are off-chart: south of frame,
# mythic, or fictional.

[locations]
"waterdeep" = { x = 34.9, y = 78.3, dir = "w" }
"nightstone" = { x = 43.3, y = 79.3, dir = "se" }
"ardeep-forest" = { x = 42.8, y = 76.6, dir = "nw" }  # west of dot to clear Nightstone
"golden-fields" = { x = 44.3, y = 71.8, dir = "ne" }  # north of dot to clear Ardeep
"triboar" = { x = 42.2, y = 43.8 }
"kryptgarden-forest" = { x = 36.7, y = 58.1 }
"silverymoon" = { x = 58.4, y = 27.0 }
"silver-marches" = { x = 71.8, y = 15.9 }  # region label
"spine-of-the-world" = { x = 38.8, y = 9.3 }  # region label across top
"bryn-shandar" = { x = 19.5, y = 11.1, dir = "se" }  # "Bryn Shander" in the source CSV

# Not on the canon map — campaign-specific wreck site, placed offshore
# in the Sea of Swords, west of Nightstone.
"the-true-hand" = { x = 38.0, y = 83.0, dir = "w" }

# Off-chart cartouches:
"athkatla" = { cartouche = "Far South" }
"halruaa" = { cartouche = "Far South" }
"eye-of-annam" = { cartouche = "Beyond the Charts" }
"pearl-isles" = { cartouche = "Beyond the Charts" }
"darkar" = { cartouche = "Whereabouts Unknown" }
"darkhope" = { cartouche = "Whereabouts Unknown" }
